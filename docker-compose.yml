# Ostiary on one machine: Postgres, the migrations, the auth app, the admin console and the
# daily housekeeping job. See docs/self-hosting.md.
#
#   cp .env.docker.example .env   # then fill it in
#   docker compose up -d --build
#
# Put a reverse proxy with TLS in front of ports 3000 (auth) and 3001 (admin), and set the
# URLs in .env to the public https addresses.

x-app-env: &app-env
  DATABASE_URL: postgresql://ostiary:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/ostiary
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  BETTER_AUTH_URL: ${AUTH_APP_URL:?set AUTH_APP_URL in .env}
  AUTH_APP_URL: ${AUTH_APP_URL}
  ADMIN_APP_URL: ${ADMIN_APP_URL:?set ADMIN_APP_URL in .env}
  NEXT_PUBLIC_APP_URL: ${AUTH_APP_URL}
  NEXT_PUBLIC_ADMIN_APP_URL: ${ADMIN_APP_URL}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in .env}
  RESEND_FROM: ${RESEND_FROM:?set RESEND_FROM in .env}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  REQUIRE_ADMIN_2FA: ${REQUIRE_ADMIN_2FA:-true}
  EMAIL_DEDUP: ${EMAIL_DEDUP:-}
  CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
  # Where the client IP comes from: the header your reverse proxy sets (docs/self-hosting.md).
  IP_ADDRESS_HEADERS: ${IP_ADDRESS_HEADERS:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-}
  CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
  CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
  OAUTH_API_SCOPES: ${OAUTH_API_SCOPES:-}
  OAUTH_API_AUDIENCES: ${OAUTH_API_AUDIENCES:-}
  API_KEY_PREFIX: ${API_KEY_PREFIX:-}
  # Other variables from docs/configuration.md (GITHUB_CLIENT_ID, SCIM_TOKEN_SECRET, ...): add
  # them here as `NAME: ${NAME}` and set them in .env.

# The browser-side URLs and the captcha provider are built into the apps.
x-build-args: &build-args
  NEXT_PUBLIC_APP_URL: ${AUTH_APP_URL}
  NEXT_PUBLIC_ADMIN_APP_URL: ${ADMIN_APP_URL}
  CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ostiary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ostiary
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ostiary -d ostiary"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs once per `docker compose up`: applies new migrations, registers the OAuth resources
  # (APIs) from the environment, then exits.
  migrate:
    build: { context: ., target: migrate }
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  auth:
    build: { context: ., target: auth, args: *build-args }
    restart: unless-stopped
    environment: *app-env
    ports: ["${AUTH_PORT:-3000}:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  admin:
    build: { context: ., target: admin, args: *build-args }
    restart: unless-stopped
    environment: *app-env
    ports: ["${ADMIN_PORT:-3001}:3001"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Daily housekeeping (webhook retries, retention), at 04:00 UTC like apps/auth/vercel.json.
  cron:
    image: alpine:3.22
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command:
      - sh
      - -c
      - |
        # The secret is written into the job: crond does not pass its environment on.
        echo "0 4 * * * wget -q -O - --header 'Authorization: Bearer $$CRON_SECRET' http://auth:3000/api/cron/webhooks" > /etc/crontabs/root
        exec crond -f -l 8
    depends_on:
      auth: { condition: service_healthy }

volumes:
  db-data:
