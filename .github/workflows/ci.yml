name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: re_ci_placeholder_not_used_at_build_time
      RESEND_FROM: "Ostiary <onboarding@resend.dev>"
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build (auth and admin apps)
        run: pnpm build
        env:
          DATABASE_URL: postgresql://127.0.0.1:5432/ci
          BETTER_AUTH_SECRET: "01234567890123456789012345678901"
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          AUTH_APP_URL: http://localhost:3000
          ADMIN_APP_URL: http://localhost:3001
          NEXT_PUBLIC_ADMIN_APP_URL: http://localhost:3001

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17 # Docker Hub rate-limits anonymous pulls
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ostiary_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Everything else comes from e2e/.env.test (dummy values only).
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ostiary_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./e2e/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ostiary/e2e exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ostiary/e2e exec playwright install-deps chromium

      - name: Cache Next.js builds
        uses: actions/cache@v4
        with:
          path: |
            apps/auth/.next/cache
            apps/admin/.next/cache
          key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Migrate and seed the database
        run: pnpm --filter @ostiary/e2e db:setup

      - name: Build the auth and admin apps
        run: pnpm --filter @ostiary/e2e build:apps

      - name: End-to-end tests
        run: pnpm --filter @ostiary/e2e test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
