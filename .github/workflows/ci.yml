name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: re_ci_placeholder_not_used_at_build_time
      RESEND_FROM: "Ostiary <onboarding@resend.dev>"
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Two copies of one package (better-auth with different peer resolutions) break its
      # types in ways that read like unrelated errors; this names the problem instead.
      - name: No duplicate packages
        run: pnpm dedupe --check

      # A schema change committed without its migration (or a hand-edited snapshot) fails here.
      # Neither command connects to a database.
      - name: Migrations match the schema
        working-directory: packages/core
        run: |
          pnpm exec drizzle-kit check
          pnpm exec drizzle-kit generate
          git diff --exit-code -- src/db/migrations
          untracked="$(git ls-files --others --exclude-standard -- src/db/migrations)"
          if [ -n "$untracked" ]; then
            echo "::error::drizzle-kit generated a migration that is not committed:"
            echo "$untracked"
            exit 1
          fi

      # apps/auth/openapi.json (the API reference on ostiary.dev) must match the auth config.
      - name: OpenAPI schema is up to date
        run: pnpm --filter @ostiary/core openapi --check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # No build here: the e2e job runs the same production build of both apps (`next build`,
      # with its own URLs), so a build failure still fails CI, and each app is built once.

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Docker Hub rate-limits anonymous pulls, and AWS's public registry refuses them past a data
        # limit ("Data limit exceeded"). Google's mirror of Docker Hub serves the same official image.
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ostiary_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Everything else comes from e2e/.env.test (dummy values only).
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ostiary_e2e
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./e2e/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ostiary/e2e exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ostiary/e2e exec playwright install-deps chromium

      - name: Cache Next.js builds
        uses: actions/cache@v6
        with:
          path: |
            apps/auth/.next/cache
            apps/admin/.next/cache
          key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Migrate and seed the database
        run: pnpm --filter @ostiary/e2e db:setup

      - name: Build the auth and admin apps
        run: pnpm --filter @ostiary/e2e build:apps

      - name: End-to-end tests
        run: pnpm --filter @ostiary/e2e test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
