# Dependency updates. Minor and patch releases are grouped into one pull request per
# ecosystem each week; major releases come one per package, to be read before merging.
# A release is proposed once it is a week old (cooldown): a compromised package is usually
# found and pulled within days, before it would reach this repository.
version: 2
updates:
  - package-ecosystem: npm # pnpm workspaces and pnpm-lock.yaml are supported
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
